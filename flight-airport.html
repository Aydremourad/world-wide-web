<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Airport Board</title>
<link rel="stylesheet" href="style.css">
<style>
.boardbox{
background:#fff;
border:1px solid #7f8790;
-webkit-border-radius:11px;
border-radius:11px;
padding:10px;
margin-bottom:10px;
-webkit-box-shadow:0 1px 2px rgba(0,0,0,.20),inset 0 1px 0 #fff;
box-shadow:0 1px 2px rgba(0,0,0,.20),inset 0 1px 0 #fff
}
.boardbox h1{font-size:20px;line-height:23px;margin:0 0 4px}
.boardbox p{margin:3px 0;font-size:12px;line-height:17px;color:#444}
.boardtabs{
border:1px solid #596b7c;
-webkit-border-radius:8px;
border-radius:8px;
overflow:hidden;
height:34px;
margin-bottom:9px;
white-space:nowrap;
background:#d8dde2
}
.boardtabs a{
display:inline-block;
width:50%;
height:34px;
line-height:34px;
text-align:center;
font-size:13px;
font-weight:bold;
text-decoration:none;
color:#385487;
background:#eef1f4
}
.boardtabs a:first-child{-webkit-border-top-left-radius:7px;-webkit-border-bottom-left-radius:7px;border-top-left-radius:7px;border-bottom-left-radius:7px}
.boardtabs a:last-child{-webkit-border-top-right-radius:7px;-webkit-border-bottom-right-radius:7px;border-top-right-radius:7px;border-bottom-right-radius:7px}
.boardtabs a.sel{
color:#fff;
background:#417eaf;
background:-webkit-gradient(linear,left top,left bottom,from(#6da1cd),to(#2e6d9f));
text-shadow:0 -1px 0 #31536e
}
.scrollhint{
font-size:10px;
color:#66717c;
text-align:center;
padding:0 0 6px;
text-shadow:0 1px 0 #fff
}
.boardnav{
height:34px;
margin:0 0 7px;
white-space:nowrap;
text-align:center
}
.boardnav button{
height:30px;
min-width:88px;
margin:0 4px;
padding:0 10px;
font:bold 12px Helvetica,Arial,sans-serif;
color:#385487;
border:1px solid #7b8792;
-webkit-border-radius:7px;
border-radius:7px;
background:#eceff2;
background:-webkit-gradient(linear,left top,left bottom,from(#fff),to(#d6dbe0));
text-shadow:0 1px 0 #fff
}
#boardwindow{
width:300px;
height:445px;
overflow:auto;
-webkit-overflow-scrolling:touch;
border:1px solid #7f8790;
-webkit-border-radius:9px;
border-radius:9px;
background:#fff;
-webkit-box-shadow:inset 0 1px 2px rgba(0,0,0,.18);
box-shadow:inset 0 1px 2px rgba(0,0,0,.18)
}
#boardcanvas{
width:700px;
height:430px;
background:#fff
}
#boardframe{
display:block;
width:700px;
height:430px;
border:0;
margin:0;
padding:0;
background:#fff
}
</style>
<script>
var airport='';
function getParam(name){
 var s=window.location.search.substring(1).split('&');
 var i,p;
 for(i=0;i<s.length;i++){
  p=s[i].split('=');
  if(p[0]==name){return decodeURIComponent((p[1]||'').replace(/\+/g,' '));}
 }
 return '';
}
function cleanAirport(v){
 v=(v||'').replace(/\s+/g,'').toUpperCase();
 if(v.length==4 && v.charAt(0)=='K'){v=v.substring(1);}
 return v;
}
function moveBoard(amount){
 var w=document.getElementById('boardwindow');
 if(w){w.scrollLeft=w.scrollLeft+amount;}
 return false;
}
function showBoard(type){
 var a=document.getElementById('arrtab');
 var d=document.getElementById('deptab');
 if(type=='departures'){a.className='';d.className='sel';}
 else{a.className='sel';d.className='';type='arrivals';}
 var frame=document.getElementById('boardframe');
 frame.src='https://www.avionio.com/widget/en/'+airport.toLowerCase()+'/'+type+'?style=3';
 return false;
}
function init(){
 airport=cleanAirport(getParam('airport'));
 var type=getParam('type');
 var dest=cleanAirport(getParam('dest'));
 if(!airport.match(/^[A-Z0-9]{3}$/)){
  document.getElementById('titlecode').innerHTML='Airport';
  document.getElementById('boardarea').innerHTML='<div class="boardbox"><b>Airport code not recognized.</b><p>Return to Flight Track and enter a three-letter airport code such as FWA.</p></div>';
  return;
 }
 document.title=airport+' Airport Board';
 document.getElementById('titlecode').innerHTML=airport+' Airport Board';
 document.getElementById('airportname').innerHTML=airport+' live flight board';
 if(dest && dest.match(/^[A-Z0-9]{3}$/)){
  document.getElementById('routehint').innerHTML='<b>'+airport+' to '+dest+'</b><p>Showing '+airport+' departures. Slide the board sideways and look for '+dest+' in the destination column.</p>';
  document.getElementById('routehint').style.display='block';
 }
 if(type=='departures'){showBoard('departures');}else{showBoard('arrivals');}
}
</script>
</head>
<body onload="init()">
<div class="page">
<div class="top"><a class="back" href="index.html">WWW</a><span id="titlecode">Airport Board</span></div>
<div class="content">
<div class="boardbox">
<h1 id="airportname">Airport Board</h1>
<p>Live arrivals and departures.</p>
</div>

<div id="boardarea">
<div id="routehint" class="boardbox" style="display:none"></div>
<div class="boardtabs"><a id="arrtab" class="sel" href="#" onclick="return showBoard('arrivals')">Arrivals</a><a id="deptab" href="#" onclick="return showBoard('departures')">Departures</a></div>
<div class="scrollhint">Use the buttons to move across the flight details.</div>
<div class="boardnav"><button type="button" onclick="return moveBoard(-210)">&#9664; Left</button><button type="button" onclick="return moveBoard(210)">Right &#9654;</button></div>
<div id="boardwindow">
<div id="boardcanvas"><iframe id="boardframe" frameborder="0" scrolling="yes" title="Live airport board"></iframe></div>
</div>
</div>

<div class="group">
<div class="list"><a href="flight-track.html">New Flight Search</a></div>
</div>
</div>
<div class="footer">Flight Track</div>
</div>
</body>
</html>
