<!doctype html>
<html manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
<title>Airport Board</title>
<link rel="stylesheet" href="style.css">
<style>
.boardbox{
background:#fff;
border:2px solid #78818a;
-webkit-border-radius:10px;
border-radius:10px;
padding:9px;
margin-bottom:10px;
-webkit-box-shadow:0 1px 1px rgba(0,0,0,.18),inset 0 1px 0 #fff;
box-shadow:0 1px 1px rgba(0,0,0,.18),inset 0 1px 0 #fff
}
.boardbox h1{font-size:20px;line-height:23px;margin:0 0 4px}
.boardbox p{margin:3px 0;font-size:12px;line-height:17px;color:#444}
.boardtabs{
height:36px;
margin:0 0 10px;
padding:2px;
background:#78818a;
border:0;
-webkit-border-radius:10px;
border-radius:10px;
white-space:nowrap;
overflow:hidden
}
.boardtabs a{
display:block;
float:left;
width:50%;
height:32px;
line-height:32px;
text-align:center;
font-size:13px;
font-weight:bold;
text-decoration:none;
color:#385487;
background:#f7f7f7;
text-shadow:0 1px 0 #fff
}
.boardtabs a:first-child{
-webkit-border-top-left-radius:8px;
-webkit-border-bottom-left-radius:8px;
border-top-left-radius:8px;
border-bottom-left-radius:8px;
border-right:1px solid #c5cbd1
}
.boardtabs a:last-child{
-webkit-border-top-right-radius:8px;
-webkit-border-bottom-right-radius:8px;
border-top-right-radius:8px;
border-bottom-right-radius:8px
}
.boardtabs a.sel{
color:#fff;
background:#3f79ad;
background:-webkit-gradient(linear,left top,left bottom,from(#6da0cb),to(#2d699c));
text-shadow:0 -1px 0 #31536e
}
.flightlist{
background:#fff;
border:2px solid #78818a;
-webkit-border-radius:10px;
border-radius:10px;
overflow:hidden;
-webkit-box-shadow:0 1px 1px rgba(0,0,0,.16);
box-shadow:0 1px 1px rgba(0,0,0,.16)
}
.flightrow{
padding:9px 10px 8px;
border-bottom:1px solid #cfd3d7;
background:#fff
}
.flightrow:first-child{
-webkit-border-top-left-radius:8px;
-webkit-border-top-right-radius:8px;
border-top-left-radius:8px;
border-top-right-radius:8px
}
.flightrow:last-child{
border-bottom:0;
-webkit-border-bottom-left-radius:8px;
-webkit-border-bottom-right-radius:8px;
border-bottom-left-radius:8px;
border-bottom-right-radius:8px
}
.flighttop{height:21px;line-height:21px;white-space:nowrap}
.ftime{float:left;font-size:17px;font-weight:bold;color:#222}
.fnum{float:right;font-size:14px;font-weight:bold;color:#385487}
.froute{clear:both;font-size:13px;font-weight:bold;color:#222;line-height:17px;padding-top:2px}
.fcity{font-weight:normal;color:#555}
.fmeta{font-size:11px;color:#666;line-height:15px;margin-top:2px}
.fop{font-size:10px;color:#888;line-height:13px;margin-top:1px}
.loadingrow,.emptyrow{
padding:18px 10px;
font-size:13px;
line-height:18px;
text-align:center;
color:#666;
background:#fff;
-webkit-border-radius:8px;
border-radius:8px
}
.statusline{
font-size:10px;
line-height:14px;
color:#66717c;
text-align:center;
padding:0 4px 7px;
text-shadow:0 1px 0 #fff
}
.fallback{margin-top:10px}
</style>
<script>
var airport='';
var boardType='arrivals';
var destination='';
var flights=[];
var pending=0;
var requestNumber=0;
var boardStartedFor=0;
var successfulParts=0;
var failedParts=0;
var parseErrorCount=0;
var preferredProxy=0;
var boardYear=0;
var boardMonth=0;
var boardDay=0;
var boardDateLabel='';
var boardHour=12;
var boardMinute=0;
var boardWindowHours=24;
var seenFlights={};
var visibleLimit=50;
var proxies=['https://api.allorigins.win/get','https://allorigins.hexlet.app/get'];

function getParam(name){
 var s=window.location.search.substring(1).split('&');
 var i,p;
 for(i=0;i<s.length;i++){
  p=s[i].split('=');
  if(p[0]==name){return decodeURIComponent((p[1]||'').replace(/\+/g,' '));}
 }
 return '';
}
function cleanAirport(v){
 v=(v||'').replace(/\s+/g,'').toUpperCase();
 if(v.length==4 && v.charAt(0)=='K'){v=v.substring(1);}
 return v;
}
function parseJSONOld(s){
 if(window.JSON && JSON.parse){return JSON.parse(s);}
 return eval('('+s+')');
}
function esc(s){
 s=''+(s==null?'':s);
 return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pad2(n){return n<10?'0'+n:''+n;}
function proxyURL(proxyIndex,cb,target){
 return proxies[proxyIndex]+'?callback='+cb+'&disableCache=true&url='+encodeURIComponent(target);
}
function outerOkay(data){
 if(!data){return false;}
 if(data.status && data.status.http_code){
  var c=parseInt(data.status.http_code,10);
  if(c>=400){return false;}
 }
 return true;
}
function parseAirportDate(s){
 var p=(s||'').split('-');
 var mons={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
 if(p.length!=3 || !mons[p[1]]){return false;}
 boardDay=parseInt(p[0],10);
 boardMonth=mons[p[1]];
 boardYear=parseInt(p[2],10);
 boardDateLabel=s;
 return boardYear>2000 && boardMonth>0 && boardDay>0;
}
function parseAirportTime(s){
 var p=(s||'').split(':');
 var h=parseInt(p[0],10);
 var m=parseInt(p[1],10);
 if(isNaN(h) || h<0 || h>23){return false;}
 if(isNaN(m) || m<0 || m>59){m=0;}
 boardHour=h;
 boardMinute=m;
 return true;
}
function useDeviceDate(){
 var d=new Date();
 boardYear=d.getFullYear();
 boardMonth=d.getMonth()+1;
 boardDay=d.getDate();
 boardHour=d.getHours();
 boardMinute=d.getMinutes();
 boardDateLabel=pad2(boardDay)+'/'+pad2(boardMonth)+'/'+boardYear;
}
function showBoard(type){
 boardType=(type=='departures')?'departures':'arrivals';
 document.getElementById('arrtab').className=(boardType=='arrivals')?'sel':'';
 document.getElementById('deptab').className=(boardType=='departures')?'sel':'';
 if(destination && boardType!='departures'){destination='';}
 loadBoard();
 return false;
}
function loadBoard(){
 requestNumber++;
 var id=requestNumber;
 boardStartedFor=0;
 flights=[];
 seenFlights={};
 visibleLimit=50;
 pending=0;
 successfulParts=0;
 failedParts=0;
 parseErrorCount=0;
 preferredProxy=0;
 boardDateLabel='';
 document.getElementById('flightlist').innerHTML='<div class="loadingrow">Loading '+esc(airport)+' '+esc(boardType)+'...</div>';
 document.getElementById('statusline').innerHTML='Finding the airport\'s local date...';
 loadAirportDate(id,0);
 window.setTimeout(function(){
  if(id==requestNumber && boardStartedFor!=id){
   useDeviceDate();
   startBoardParts(id);
  }
 },12000);
}
function loadAirportDate(id,proxyIndex){
 var target='https://www.flightstats.com/v2/api/airport/'+airport+'?rqid=wwweb2g';
 var cb='wwAirportDate'+id+'_'+proxyIndex;
 window[cb]=function(data){
  if(id!=requestNumber || boardStartedFor==id){return;}
  var ok=false;
  try{
   if(outerOkay(data) && data && typeof data.contents=='string' && data.contents.length){
    var obj=parseJSONOld(data.contents);
    if(obj && obj.detailsHeader && parseAirportDate(obj.detailsHeader.currentDate)){
     parseAirportTime(obj.detailsHeader.currentTime);
     preferredProxy=proxyIndex;
     ok=true;
    }
   }
  }catch(e){}
  try{window[cb]=null;}catch(e2){}
  if(ok){startBoardParts(id);}
  else if(proxyIndex==0){loadAirportDate(id,1);}
  else{
   useDeviceDate();
   startBoardParts(id);
  }
 };
 var s=document.createElement('script');
 s.type='text/javascript';
 s.src=proxyURL(proxyIndex,cb,target);
 s.onerror=function(){
  if(id!=requestNumber || boardStartedFor==id){return;}
  if(proxyIndex==0){loadAirportDate(id,1);}
  else{useDeviceDate();startBoardParts(id);}
 };
 document.getElementsByTagName('head')[0].appendChild(s);
}
function startBoardParts(id){
 if(id!=requestNumber || boardStartedFor==id){return;}
 boardStartedFor=id;
 flights=[];
 seenFlights={};
 visibleLimit=50;
 successfulParts=0;
 failedParts=0;
 parseErrorCount=0;
 document.getElementById('statusline').innerHTML='Loading '+esc(boardDateLabel)+' flight board...';
 if(destination){
  var remain=24-boardHour;
  var first=remain>12?12:remain;
  var second=remain-first;
  boardWindowHours=remain;
  pending=second>0?2:1;
  loadPart(boardHour,id,preferredProxy,0,first);
  if(second>0){loadPart(boardHour+first,id,preferredProxy,0,second);}
 }else{
  var hours=24-boardHour;
  if(hours>6){hours=6;}
  if(hours<1){hours=1;}
  boardWindowHours=hours;
  pending=1;
  loadPart(boardHour,id,preferredProxy,0,hours);
 }
 window.setTimeout(function(){
  if(id==requestNumber && pending>0){
   failedParts+=pending;
   pending=0;
   renderBoard();
  }
 },25000);
}
function flightKey(f){
 var a=(f&&f.airport)?f.airport:{};
 var d=(f&&f.departureTime)?f.departureTime:{};
 var r=(f&&f.arrivalTime)?f.arrivalTime:{};
 var dep=d.time24||d.timeAMPM||'';
 var arr=r.time24||r.timeAMPM||'';
 var sort=f&&f.sortTime?f.sortTime:'';
 return 'k:'+(a.fs||'')+'|'+dep+'|'+arr+'|'+sort;
}
function addFlight(f){
 var k=flightKey(f);
 if(seenFlights[k]){return;}
 seenFlights[k]=1;
 flights[flights.length]=f;
}
function loadPart(hour,id,proxyIndex,attempt,numHours){
 var kind=(boardType=='departures')?'dep':'arr';
 var target='https://www.flightstats.com/v2/api-next/flight-tracker/'+kind+'/'+airport+'/'+boardYear+'/'+boardMonth+'/'+boardDay+'/'+hour+'?numHours='+numHours;
 var cb='wwFlightCb'+id+'_'+hour+'_'+proxyIndex+'_'+attempt+'_'+numHours;
 window[cb]=function(data){
  if(id!=requestNumber){return;}
  var ok=false;
  try{
   if(outerOkay(data) && data && typeof data.contents=='string' && data.contents.length){
    var obj=parseJSONOld(data.contents);
    if(obj && !obj.error && obj.data && typeof obj.data.flights!='undefined'){
     var a=obj.data.flights||[];
     var i;
     for(i=0;i<a.length;i++){addFlight(a[i]);}
     successfulParts++;
     ok=true;
    }
   }
  }catch(e){parseErrorCount++;}
  try{window[cb]=null;}catch(e2){}
  if(ok){partFinished();}
  else{retryPart(hour,id,proxyIndex,attempt,numHours);}
 };
 var s=document.createElement('script');
 s.type='text/javascript';
 s.src=proxyURL(proxyIndex,cb,target);
 s.onerror=function(){
  if(id==requestNumber){retryPart(hour,id,proxyIndex,attempt,numHours);}
 };
 document.getElementsByTagName('head')[0].appendChild(s);
}
function retryPart(hour,id,proxyIndex,attempt,numHours){
 if(id!=requestNumber){return;}
 if(attempt<1){
  loadPart(hour,id,proxyIndex==0?1:0,attempt+1,numHours);
 }else{
  failedParts++;
  partFinished();
 }
}
function partFinished(){
 if(pending>0){pending--;}
 if(pending<=0){renderBoard();}
}
function sortFlights(){
 flights.sort(function(a,b){
  var x=a.sortTime||'',y=b.sortTime||'';
  if(x<y){return -1;} if(x>y){return 1;} return 0;
 });
}
function showMoreFlights(){
 visibleLimit+=50;
 renderBoard();
 return false;
}
function timeMinutes(v){
 var p=(v||'').split(':');
 if(p.length<2){return -1;}
 var h=parseInt(p[0],10);
 var m=parseInt(p[1],10);
 if(isNaN(h)||isNaN(m)){return -1;}
 return h*60+m;
}
function isPastFlight(f){
 var t=(boardType=='departures')?(f.departureTime||{}):(f.arrivalTime||{});
 var mins=timeMinutes(t.time24||'');
 if(mins<0){return false;}
 return mins<(boardHour*60+boardMinute);
}
function renderBoard(){
 var list=[];
 var i,f,other;
 sortFlights();
 for(i=0;i<flights.length;i++){
  f=flights[i];
  if(isPastFlight(f)){continue;}
  other=(f.airport&&f.airport.fs)?cleanAirport(f.airport.fs):'';
  if(destination && other!=destination){continue;}
  list[list.length]=f;
 }
 var title=airport+' '+(boardType=='departures'?'Departures':'Arrivals');
 if(destination){title=airport+' to '+destination;}
 document.getElementById('airportname').innerHTML=esc(title);
 var h='';
 var renderCount=list.length;
 if(renderCount>visibleLimit){renderCount=visibleLimit;}
 for(i=0;i<renderCount;i++){
  f=list[i];
  var c=f.carrier||{};
  var ap=f.airport||{};
  var dep=f.departureTime||{};
  var arr=f.arrivalTime||{};
  var primary=(boardType=='departures')?(dep.timeAMPM||dep.time24||'--'):(arr.timeAMPM||arr.time24||'--');
  var secondary=(boardType=='departures')?(arr.timeAMPM||arr.time24||'--'):(dep.timeAMPM||dep.time24||'--');
  var dir=(boardType=='departures')?'to':'from';
  var secondaryLabel=(boardType=='departures')?'Arrives':'Departs';
  var number=(c.fs||'')+(c.flightNumber||'');
  h+='<div class="flightrow">';
  h+='<div class="flighttop"><span class="ftime">'+esc(primary)+'</span><span class="fnum">'+esc(number)+'</span></div>';
  h+='<div class="froute">'+dir+' '+esc(ap.fs||'')+' <span class="fcity">'+esc(ap.city||'')+'</span></div>';
  h+='<div class="fmeta">'+esc(secondaryLabel)+' '+esc(secondary);
  if(c.name){h+=' &middot; '+esc(c.name);}
  h+='</div>';
  if(f.operatedBy){h+='<div class="fop">'+esc(f.operatedBy)+'</div>';}
  h+='</div>';
 }
 if(list.length>renderCount){
  h+='<div class="loadingrow"><a href="#" onclick="return showMoreFlights()">Show 50 More Flights</a></div>';
 }
 if(!h){
  if(successfulParts==0){
   h='<div class="emptyrow"><b>Flight data could not be reached.</b><br>Both live data connections failed. Please try again.</div>';
  }else if(failedParts>0){
   h='<div class="emptyrow">No matching flights were found in the part of the '+esc(boardDateLabel)+' board that loaded.</div>';
  }else{
   h='<div class="emptyrow">No '+esc(destination?airport+' to '+destination:boardType)+' flights were found for '+esc(boardDateLabel)+'.</div>';
  }
 }
 document.getElementById('flightlist').innerHTML=h;
 if(successfulParts==0){
  document.getElementById('statusline').innerHTML='Live data request failed';
 }else if(failedParts>0){
  document.getElementById('statusline').innerHTML=renderCount+(list.length>renderCount?' of '+list.length:'')+' flight'+(list.length==1?'':'s')+' shown &middot; '+esc(boardDateLabel)+' &middot; Partial board';
 }else{
  document.getElementById('statusline').innerHTML=renderCount+(list.length>renderCount?' of '+list.length:'')+' flight'+(list.length==1?'':'s')+' shown &middot; '+esc(boardDateLabel)+(destination?'':' &middot; Current '+boardWindowHours+'-hour window');
 }
}
function init(){
 airport=cleanAirport(getParam('airport'));
 destination=cleanAirport(getParam('dest'));
 var type=getParam('type');
 if(type=='departures' || destination){boardType='departures';}
 if(!airport.match(/^[A-Z0-9]{3}$/)){
  document.getElementById('titlecode').innerHTML='Airport';
  document.getElementById('airportname').innerHTML='Airport Board';
  document.getElementById('flightlist').innerHTML='<div class="emptyrow">Airport code not recognized. Return to Flight Track and enter a three-letter IATA code.</div>';
  return;
 }
 document.title=airport+' Airport Board';
 document.getElementById('titlecode').innerHTML=airport+' Airport Board';
 document.getElementById('arrtab').className=(boardType=='arrivals')?'sel':'';
 document.getElementById('deptab').className=(boardType=='departures')?'sel':'';
 if(destination){
  document.getElementById('routebox').style.display='block';
  document.getElementById('routebox').innerHTML='<b>'+esc(airport)+' to '+esc(destination)+'</b><p>Direct departures matching this route.</p>';
 }
 loadBoard();
}
</script>
</head>
<body onload="init()">
<div class="page">
<div class="top"><a class="back" href="index.html">WWW</a><span id="titlecode">Airport Board</span></div>
<div class="content">

<div class="boardbox">
<h1 id="airportname">Airport Board</h1>
<p>Live flight information in a compact board.</p>
</div>

<div id="routebox" class="boardbox" style="display:none"></div>

<div class="boardtabs">
<a id="arrtab" class="sel" href="#" onclick="return showBoard('arrivals')">Arrivals</a><a id="deptab" href="#" onclick="return showBoard('departures')">Departures</a>
</div>

<div id="statusline" class="statusline">Loading today's flight board</div>
<div id="flightlist" class="flightlist"><div class="loadingrow">Loading...</div></div>

<div class="group fallback">
<div class="list"><a href="flight-track.html">New Flight Search</a></div>
</div>

</div>
<div class="footer">Flight Track</div>
</div>
<script src="webapp.js"></script></body>
</html>
