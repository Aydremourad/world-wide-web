# Optional paid always-on profile for the unmodified upstream server.
services:
  - type: web
    name: youtube-2g
    runtime: docker
    plan: 1c-2g
    branch: youtube-2g-server
    dockerfilePath: ./youtube-2g/Dockerfile
    dockerContext: ./youtube-2g
    healthCheckPath: /
    autoDeployTrigger: "commit"
    disk:
      name: tuberepair-data
      mountPath: /app/modified-tuberepair/tuberepair/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: DEBUG
        value: "false"
      - key: SPYING
        value: "false"
      - key: COMPRESS
        value: "true"
      - key: MEDIUM_QUALITY
        value: "true"
      - key: USE_REDIS
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
