services:
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:4416:4416"

  tuberepair:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      bgutil-provider:
        condition: service_started
    environment:
      PORT: "10000"
      DEBUG: "false"
      SPYING: "false"
      COMPRESS: "true"
      MEDIUM_QUALITY: "true"
      USE_REDIS: "false"
      TUBEREPAIR_DATA_DIR: "/var/data"
      SERVER_THREADS: "8"
      LOCAL_COMPANION_URL: ""
      INVIDIOUS_VIDEO_PROXIES: ""
      YTDLP_COOKIE_FILE: "/var/data/youtube-cookies.txt"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    volumes:
      - tuberepair-data:/var/data

  companion:
    build:
      context: ./companion
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      SERVER_SECRET_KEY: "${COMPANION_SECRET_KEY}"
      HOST: "127.0.0.1"
      PORT: "8282"
      CACHE_DIRECTORY: "/var/tmp/youtubei.js"
      SERVER_VERIFY_REQUESTS: "false"
      NETWORKING_IPV6_BLOCK: "${COMPANION_IPV6_BLOCK}"
      YOUTUBE_SESSION_OAUTH_ENABLED: "false"
      JOBS_YOUTUBE_SESSION_PO_TOKEN_ENABLED: "true"
    volumes:
      - companion-cache:/var/tmp

volumes:
  tuberepair-data:
  companion-cache:
