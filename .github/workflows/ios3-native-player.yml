name: iOS 3 native player
on:
  push:
    branches: [youtube-native-player-ios3]
    paths: [youtube-direct-ios3/**, .github/workflows/ios3-native-player.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm11:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM11 emulator and cross compiler
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi qemu-user
      - name: Verify ARMv6 CABAC and RGB565 on emulated ARM1176
        working-directory: youtube-direct-ios3
        run: sh tests/run-arm11-test.sh
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install signing tool
        run: brew install ldid
      - uses: actions/cache/restore@v4
        id: toolchain
        with:
          key: ios3-armv6-macos15-v1
          path: |
            ${{ runner.temp }}/cctools-armv6
            ${{ runner.temp }}/ios3
      - name: Build ARMv6 linker and fetch SDK
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          brew install autoconf automake libtool
          git clone --depth 1 https://github.com/tpoechtrager/cctools-port.git "$RUNNER_TEMP/cctools-port"
          cd "$RUNNER_TEMP/cctools-port/cctools"
          ./configure --prefix="$RUNNER_TEMP/cctools-armv6" --target=arm-apple-darwin11 --without-libtapi
          make -j3
          make install
          mkdir -p "$RUNNER_TEMP/ios3/sdks"
          curl -fL --retry 2 https://github.com/qianjigui/iOS-sdks/raw/master/iPhoneOS3.1.3.sdk.tbz2 -o "$RUNNER_TEMP/sdk.tbz2"
          tar -xjf "$RUNNER_TEMP/sdk.tbz2" -C "$RUNNER_TEMP/ios3/sdks"
      - uses: actions/cache/save@v4
        if: steps.toolchain.outputs.cache-hit != 'true'
        with:
          key: ios3-armv6-macos15-v1
          path: |
            ${{ runner.temp }}/cctools-armv6
            ${{ runner.temp }}/ios3
      - name: Check bounded streaming and cancellation
        working-directory: youtube-direct-ios3
        run: sh tests/run-range-test.sh
      - name: Check stream resolver and fallback
        working-directory: youtube-direct-ios3
        run: sh tests/run-resolver-test.sh
      - uses: actions/cache/restore@v4
        id: decoder
        if: always()
        with:
          key: ios3-armv6-ffmpeg-2.8.22-decoder-v5-arm11-cabac
          path: youtube-direct-ios3/.deps
      - name: Build and check iPhone OS 3 application
        id: app_build
        if: always()
        working-directory: youtube-direct-ios3
        env:
          THEOS: ${{ runner.temp }}/ios3
          LEGACY_LD: ${{ runner.temp }}/cctools-armv6/bin/arm-apple-darwin11-ld
        run: sh ./ci-build.sh
      - name: Inspect current player availability
        working-directory: youtube-direct-ios3
        run: python3 tests/live-player-probe.py
      - name: Check combined Main-profile MP4 and native AAC reader
        working-directory: youtube-direct-ios3
        run: sh tests/run-combined-test.sh
      - uses: actions/cache/save@v4
        if: always() && steps.decoder.outputs.cache-hit != 'true'
        with:
          key: ios3-armv6-ffmpeg-2.8.22-decoder-v5-arm11-cabac
          path: youtube-direct-ios3/.deps
      - uses: actions/upload-artifact@v4
        if: always() && steps.app_build.outcome == 'success'
        with:
          name: YouTubeDirect-iOS3-armv6
          path: youtube-direct-ios3/packages/*.deb
