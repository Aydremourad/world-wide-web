<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Google">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Aydremourad/Aydre/main/internet/icons/google.png">
<meta charset="UTF-8">
<title>Google</title>
<style>
body{margin:0;padding:0;background:#fff;color:#333;font-family:Arial,Helvetica,sans-serif;font-size:13px;}
#page{width:300px;margin:0 auto;text-align:center;padding-top:42px;}
.logo{font-family:Arial,Helvetica,sans-serif;font-size:40px;font-weight:bold;letter-spacing:-3px;margin-bottom:17px;}
.g{color:#4285f4}.o1{color:#db4437}.o2{color:#f4b400}.g2{color:#4285f4}.l{color:#0f9d58}.e{color:#db4437}
.search{width:250px;height:29px;border:1px solid #999;font-size:16px;padding:3px 7px;box-sizing:border-box;-webkit-box-sizing:border-box;border-radius:2px;-webkit-border-radius:2px;}
.btn{display:inline-block;margin:9px 3px 12px 3px;padding:6px 10px;border:1px solid #aaa;background:#eee;color:#222;text-decoration:none;font-size:11px;border-radius:3px;-webkit-border-radius:3px;}
.links{border-top:1px solid #ddd;margin-top:8px;padding-top:9px;line-height:22px;}
.links a{color:#1545a0;text-decoration:underline;padding:0 5px;}
.note{color:#777;font-size:10px;margin-top:18px;line-height:15px;}
</style>
</head>
<body>
<div id="page">
<div class="logo"><span class="g">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span></div>
<form action="https://www.google.com/search" method="get">
<input class="search" name="q" type="text" value="">
<br>
<input class="btn" type="submit" value="Google Search">
<a class="btn" href="https://www.google.com/search?btnI=1&q=Google">I'm Feeling Lucky</a>
</form>
<div class="links">
<a href="https://www.google.com/">Web</a>
<a href="https://images.google.com/">Images</a>
<a href="https://news.google.com/">News</a>
<a href="https://www.google.com/maps">Local</a>
</div>
<div class="note">Google mobile search<br>Simple search for the iPhone.</div>
</div>
</body>
</html>
