<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320">
<title>Flight Track</title>
<link rel="stylesheet" href="style.css">
<style>
.flightbox{
background:#fff;
border:1px solid #6f7780;
-webkit-border-radius:9px;
border-radius:9px;
-webkit-background-clip:padding-box;
background-clip:padding-box;
padding:11px;
margin-bottom:12px;
-webkit-box-shadow:0 1px 1px rgba(0,0,0,.22),inset 0 1px 0 #fff;
box-shadow:0 1px 1px rgba(0,0,0,.22),inset 0 1px 0 #fff
}
.flightbox p{margin:4px 0;font-size:13px;line-height:18px;color:#333}
.flightbox input{
-webkit-appearance:none;
background:#fff;
-webkit-border-radius:7px;
border-radius:7px;
-webkit-background-clip:padding-box;
background-clip:padding-box;
border:1px solid #656d75;
-webkit-box-shadow:inset 0 1px 2px #c7c7c7,0 1px 0 #fff;
box-shadow:inset 0 1px 2px #c7c7c7,0 1px 0 #fff
}
.flightbox button{
-webkit-border-radius:7px;
border-radius:7px;
-webkit-background-clip:padding-box;
background-clip:padding-box
}
</style>
<script>
function clean(v){return v.replace(/\s+/g,'').toUpperCase();}
function airportBoard(){
 var a=clean(document.getElementById('airport').value);
 if(!a){return false;}
 if(a.length==4 && a.charAt(0)=='K'){a=a.substring(1);}
 if(!a.match(/^[A-Z0-9]{3}$/)){alert('Enter a three-letter airport code like FWA.');return false;}
 window.location='flight-airport.html?airport='+encodeURIComponent(a);
 return false;
}
function routeSearch(){
 var d=clean(document.getElementById('dep').value);
 var a=clean(document.getElementById('arr').value);
 if(d.length==4 && d.charAt(0)=='K'){d=d.substring(1);}
 if(a.length==4 && a.charAt(0)=='K'){a=a.substring(1);}
 if(!d.match(/^[A-Z0-9]{3}$/) || !a.match(/^[A-Z0-9]{3}$/)){alert('Enter airport codes like FWA and ORD.');return false;}
 window.location='flight-airport.html?airport='+encodeURIComponent(d)+'&type=departures&dest='+encodeURIComponent(a);
 return false;
}
</script>
</head>
<body>
<div class="page">
<div class="top"><a class="back" href="index.html">WWW</a>Flight Track</div>
<div class="content">

<div class="flightbox"><h1 style="font-size:21px;line-height:24px;margin:0 0 5px">Flight Track</h1><p>Check an airport board or find flights between two airports.</p></div>

<div class="group">
<div class="group-title">Airport board</div>
<div class="flightbox">
<form onsubmit="return airportBoard()">
<div class="row"><input id="airport" type="text" autocapitalize="characters" autocorrect="off" maxlength="4" placeholder="FWA"><button type="submit">View</button></div>
</form>
<div class="small" style="margin-top:7px">Example: FWA. Shows live arrivals and departures.</div>
</div>
</div>

<div class="group">
<div class="group-title">Find by route</div>
<div class="flightbox">
<form onsubmit="return routeSearch()">
<div style="white-space:nowrap">
<input id="dep" type="text" autocapitalize="characters" autocorrect="off" maxlength="4" placeholder="FWA" style="width:82px">
<span style="font-size:13px;padding:0 3px">to</span>
<input id="arr" type="text" autocapitalize="characters" autocorrect="off" maxlength="4" placeholder="ORD" style="width:82px">
<button type="submit" style="margin-left:4px">Find</button>
</div>
</form>
<div class="small" style="margin-top:7px">Examples: FWA to ORD, ATL, DTW, or DFW.</div>
</div>
</div>

<div class="group">
<div class="group-title">Fort Wayne</div>
<div class="list">
<a href="flight-airport.html?airport=FWA&type=departures">FWA Departures</a>
<a href="flight-airport.html?airport=FWA&type=arrivals">FWA Arrivals</a>
</div>
</div>

</div>
<div class="footer">Flight Track</div>
</div>
</body>
</html>
